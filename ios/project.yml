# Proyecto de Xcode de Quanto para iPhone (SwiftUI).
# Se genera con XcodeGen: `npm run ios` desde la raíz (o `cd ios && xcodegen`).
# Quanto.xcodeproj y Quanto/Info.plist no se versionan: salen de este archivo.
name: Quanto
options:
  bundleIdPrefix: app.quanto
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Quanto:
    type: application
    platform: iOS
    sources:
      - path: Quanto
        excludes:
          - Recursos/logica.js
      # La lógica de la web (parser, datos, motor de ahorro) que corre en JavaScriptCore
      - path: Quanto/Recursos/logica.js
        buildPhase: resources
      # El mismo catálogo que usa la web, sin copiarlo
      - path: ../web/data/catalogo.json
        buildPhase: resources
    info:
      path: Quanto/Info.plist
      properties:
        CFBundleDisplayName: Quanto
        CFBundleDevelopmentRegion: es
        LSApplicationCategoryType: public.app-category.shopping
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Quanto usa la cámara para leer las etiquetas de precio y comparar productos.
        NSRemindersFullAccessUsageDescription: Quanto puede enviar tu lista de compras a Recordatorios y traer los pendientes de allí.
        NSRemindersUsageDescription: Quanto puede enviar tu lista de compras a Recordatorios y traer los pendientes de allí.
    settings:
      base:
        # El mismo identificador que la versión anterior: así la app nueva
        # reemplaza a la vieja en el iPhone y puede traer sus datos.
        PRODUCT_BUNDLE_IDENTIFIER: app.quanto.compras
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
